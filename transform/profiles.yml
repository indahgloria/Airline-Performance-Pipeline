# Reads the same env vars as the Python side (PGHOST, PGUSER, ...), so there is one config.
airline_performance:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', env_var('USER', 'postgres')) }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'flights') }}"
      sslmode: "{{ env_var('PGSSLMODE', 'prefer') }}"
      schema: analytics
      threads: 4
